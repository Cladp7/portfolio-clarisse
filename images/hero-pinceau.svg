<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice">
  <!-- Dégradé violet → rose → corail : les couleurs du coucher de soleil -->
  <defs>
    <linearGradient id="pinceau" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C70C8"/>
      <stop offset="0.5" stop-color="#E3799B"/>
      <stop offset="1" stop-color="#FDB77A"/>
    </linearGradient>
    <!-- Même dégradé, dans l'autre sens, pour le 2e coup de pinceau -->
    <linearGradient id="pinceau-inverse" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDB77A"/>
      <stop offset="0.5" stop-color="#E3799B"/>
      <stop offset="1" stop-color="#7C70C8"/>
    </linearGradient>
    <!-- Une étincelle à 4 branches, réutilisée plusieurs fois avec <use> -->
    <path id="etincelle" d="M0 -14 C2 -2 2 -2 14 0 C2 2 2 2 0 14 C-2 2 -2 2 -14 0 C-2 -2 -2 -2 0 -14Z"/>
  </defs>

  <!-- Le grand coup de pinceau (transparent à 35 % pour que le texte reste lisible) -->
  <path d="M-60 520 C280 250 560 680 900 360 C1080 195 1260 215 1500 300"
        fill="none" stroke="url(#pinceau)" stroke-width="90" stroke-linecap="round" opacity="0.35"/>
  <!-- Le 2e coup de pinceau, qui croise le premier (dégradé inversé, plus fin et plus léger) -->
  <path d="M-60 300 C260 330 520 200 800 330 C1060 450 1240 520 1500 470"
        fill="none" stroke="url(#pinceau-inverse)" stroke-width="56" stroke-linecap="round" opacity="0.22"/>
  <!-- Le trait fin en écho -->
  <path d="M-40 650 C360 520 760 700 1480 505"
        fill="none" stroke="url(#pinceau)" stroke-width="18" stroke-linecap="round" opacity="0.3"/>

  <!-- Les étincelles : position (translate) + taille (scale) + couleur
       Aucune au-dessus de y=260 : sur les grands écrans, le haut de l'image passe
       derrière l'en-tête, et une étincelle ne doit jamais toucher le menu. -->
  <use href="#etincelle" transform="translate(1300 270) scale(3)"   fill="#D9467E"/>
  <use href="#etincelle" transform="translate(1080 300) scale(1.4)" fill="#FF9F42"/>
  <use href="#etincelle" transform="translate(1180 520) scale(1.8)" fill="#5B3FB8"/>
  <use href="#etincelle" transform="translate(940 605) scale(1)"    fill="#D3A467"/>
  <use href="#etincelle" transform="translate(900 270) scale(1.1)"  fill="#7C70C8"/>
  <use href="#etincelle" transform="translate(1380 430) scale(1)"   fill="#FF9F42"/>
</svg>