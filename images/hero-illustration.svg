<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Illustration : un tableau interactif, une tablette scolaire et un téléphone avec des applis pour enfants" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Composition autour de la bulle photo (cercle invisible : centre 500,380, rayon 260) :
         tableau en haut à gauche, tablette en bas à gauche, téléphone à droite -->
    <!-- Fondu vers le bas : l'illustration se mélange au fond de la page -->
    <linearGradient id="fondu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="masque"><rect width="1000" height="760" fill="url(#fondu)"/></mask>
    <linearGradient id="arche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9CFFB"/>
      <stop offset=".55" stop-color="#F9D3E1"/>
      <stop offset="1" stop-color="#FFE3CC"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6D4FD8" flood-opacity=".14"/>
    </filter>
  </defs>

  <g mask="url(#masque)" opacity=".92">
    <!-- grande tache douce coucher de soleil derrière les écrans -->
    <ellipse cx="500" cy="380" rx="470" ry="340" fill="url(#arche)" opacity=".75"/>

    <!-- ===== Tableau interactif (au fond, en haut à gauche) ===== -->
    <g filter="url(#ombre)" transform="translate(-110 -125)">
      <rect x="443" y="480" width="14" height="200" rx="6" fill="#CFC6F5"/><rect x="400" y="672" width="100" height="12" rx="6" fill="#CFC6F5"/>
      <rect x="170" y="150" width="560" height="340" rx="28" fill="#CFC6F5"/>
      <rect x="186" y="166" width="528" height="308" rx="18" fill="#FFFDFB"/>
      <!-- contenu : une petite leçon -->
      <text x="222" y="238" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="46" fill="#F2A7BF">a</text>
      <text x="256" y="238" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="46" fill="#FFC48F">b</text>
      <text x="292" y="238" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="46" fill="#B6A7EE">c</text>
      <rect x="222" y="262" width="210" height="12" rx="6" fill="#EEE9FD"/>
      <rect x="222" y="284" width="150" height="12" rx="6" fill="#EEE9FD"/>
      <!-- soleil + colline -->
      <circle cx="640" cy="218" r="26" fill="#FFE0A8"/>
      <path d="M470 440 Q560 330 700 400 V458 H470 Z" fill="#CDEBD9"/>
      <path d="M540 458 Q610 380 700 430 V458 Z" fill="#B7E0C8"/>
      <!-- formes à trier -->
      <rect x="222" y="330" width="62" height="62" rx="14" fill="#EEE9FD"/><circle cx="253" cy="361" r="16" fill="#B6A7EE"/>
      <rect x="298" y="330" width="62" height="62" rx="14" fill="#FDE6EE"/><path d="M329 346 l17 30 h-34z" fill="#F2A7BF"/>
      <rect x="374" y="330" width="62" height="62" rx="14" fill="#FFF0DF"/><path d="M405 345 l5 11 12 1 -9 8 3 12 -11-6 -11 6 3-12 -9-8 12-1z" fill="#FFC48F"/>
      <!-- barre de progression -->
      <rect x="222" y="420" width="214" height="12" rx="6" fill="#EEE9FD"/>
      <rect x="222" y="420" width="140" height="12" rx="6" fill="#B6A7EE"/>
    </g>

    <!-- ===== Tablette scolaire (devant, en bas à gauche), avec poignées comme le logo ===== -->
    <g filter="url(#ombre)" transform="translate(-70 100) rotate(-6 250 520)">
      <rect x="92" y="400" width="44" height="130" rx="22" fill="#D9CFFB"/>
      <rect x="364" y="400" width="44" height="130" rx="22" fill="#D9CFFB"/>
      <rect x="110" y="370" width="280" height="200" rx="30" fill="#E7E0FD"/>
      <rect x="128" y="388" width="244" height="164" rx="16" fill="#FFFDFB"/>
      <rect x="128" y="388" width="244" height="40" rx="16" fill="#E3DAFD"/>
      <rect x="128" y="412" width="244" height="16" fill="#E3DAFD"/>
      <circle cx="150" cy="408" r="9" fill="#FFFFFF"/>
      <rect x="168" y="402" width="80" height="12" rx="6" fill="#FFFFFF"/>
      <!-- carte de vocabulaire : un chat -->
      <rect x="146" y="442" width="96" height="94" rx="14" fill="#FDE6EE"/>
      <circle cx="194" cy="484" r="22" fill="#FFD9B8"/>
      <path d="M176 470 l6-16 10 12z M212 470 l-6-16 -10 12z" fill="#FFD9B8"/>
      <circle cx="186" cy="482" r="3" fill="#8E7BD9"/><circle cx="202" cy="482" r="3" fill="#8E7BD9"/>
      <path d="M189 492 q5 4 10 0" stroke="#8E7BD9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="164" y="516" width="60" height="10" rx="5" fill="#F2A7BF"/>
      <!-- réponses -->
      <rect x="256" y="444" width="100" height="26" rx="13" fill="#E7F6EE"/>
      <rect x="256" y="478" width="100" height="26" rx="13" fill="#EEE9FD"/>
      <rect x="256" y="512" width="100" height="26" rx="13" fill="#EEE9FD"/>
      <circle cx="342" cy="457" r="8" fill="#9FD9BA"/>
    </g>

    <!-- ===== Téléphone (devant, à droite) : appli inventée pour enfants « Compte avec moi » ===== -->
    <g filter="url(#ombre)" transform="translate(160 -90) rotate(5 700 520)">
      <rect x="620" y="330" width="170" height="340" rx="34" fill="#D9CFFB"/>
      <rect x="630" y="340" width="150" height="320" rx="26" fill="#FFFDFB"/>
      <rect x="683" y="350" width="44" height="12" rx="6" fill="#CFC6F5"/>
      <!-- en-tête coloré -->
      <rect x="630" y="340" width="150" height="92" rx="26" fill="#FFE3CC"/>
      <rect x="630" y="400" width="150" height="32" fill="#FFE3CC"/>
      <rect x="646" y="376" width="84" height="12" rx="6" fill="#FFFFFF"/>
      <rect x="646" y="396" width="56" height="10" rx="5" fill="#FFFFFF" opacity=".8"/>
      <!-- bulles de chiffres -->
      <circle cx="668" cy="468" r="22" fill="#FDE6EE"/><text x="668" y="478" text-anchor="middle" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="26" fill="#F2A7BF">1</text>
      <circle cx="712" cy="468" r="22" fill="#EEE9FD"/><text x="712" y="478" text-anchor="middle" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="26" fill="#B6A7EE">2</text>
      <circle cx="756" cy="468" r="18" fill="#FFF0DF"/><text x="756" y="477" text-anchor="middle" font-family="Fredoka, Nunito, Arial, sans-serif" font-weight="600" font-size="22" fill="#FFC48F">3</text>
      <!-- pommes à compter -->
      <g fill="#F7B6B6"><circle cx="668" cy="530" r="13"/><circle cx="700" cy="530" r="13"/><circle cx="732" cy="530" r="13"/></g>
      <g fill="#B7E0C8"><rect x="666" y="512" width="4" height="8" rx="2"/><rect x="698" y="512" width="4" height="8" rx="2"/><rect x="730" y="512" width="4" height="8" rx="2"/></g>
      <!-- étoiles de réussite -->
      <path d="M672 580 l4 8 9 1 -7 6 2 9 -8-5 -8 5 2-9 -7-6 9-1z M705 580 l4 8 9 1 -7 6 2 9 -8-5 -8 5 2-9 -7-6 9-1z" fill="#FFD9A0"/>
      <path d="M738 580 l4 8 9 1 -7 6 2 9 -8-5 -8 5 2-9 -7-6 9-1z" fill="#EEE9FD"/>
      <rect x="650" y="620" width="110" height="24" rx="12" fill="#CFC6F5"/>
    </g>

    <!-- étincelles discrètes -->
    <path d="M900 70 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5z" fill="#F2A7BF"/>
    <path d="M40 400 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z" fill="#CFC6F5"/>
  </g>
</svg>
